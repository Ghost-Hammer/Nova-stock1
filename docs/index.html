<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Stock</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

<header>
    <h1>Nova Stock</h1>
    <p>Stock & Profit Manager</p>
</header>

<main>

    <!-- DASHBOARD -->

    <section class="dashboard">

        <div class="card">
            <h3>Products</h3>
            <p id="totalProducts">0</p>
        </div>

        <div class="card">
            <h3>Total Stock</h3>
            <p id="totalStock">0</p>
        </div>

        <div class="card">
            <h3>Today's Sales</h3>
            <p id="todaySales">₹0</p>
        </div>

        <div class="card">
            <h3>Today's Profit</h3>
            <p id="todayProfit">₹0</p>
        </div>

        <div class="card">
            <h3>Monthly Profit</h3>
            <p id="monthProfit">₹0</p>
        </div>

        <div class="card">
            <h3>Yearly Profit</h3>
            <p id="yearProfit">₹0</p>
        </div>

    </section>


    <!-- ADD PRODUCT -->

    <section class="box">

        <h2>Add Product</h2>

        <input
            id="productName"
            type="text"
            placeholder="Product name"
        >

        <input
            id="buyPrice"
            type="number"
            placeholder="Buying price"
        >

        <input
            id="sellPrice"
            type="number"
            placeholder="Selling price"
        >

        <input
            id="stock"
            type="number"
            placeholder="Stock quantity"
        >

        <button onclick="addProduct()">
            Add Product
        </button>

    </section>


    <!-- SEARCH -->

    <section class="box">

        <h2>Products</h2>

        <input
            id="searchBox"
            type="text"
            placeholder="🔍 Search product..."
            oninput="showProducts()"
        >

        <div id="productList"></div>

    </section>


    <!-- SALES HISTORY -->

    <section class="box">

        <h2>Sales History</h2>

        <div id="salesList"></div>

    </section>

</main>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
