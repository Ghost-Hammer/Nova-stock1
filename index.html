<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Nova Stock</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>


    <!-- ================================ -->
    <!-- HEADER -->
    <!-- ================================ -->

    <header>

        <h1>Nova Stock</h1>

        <p>Stock & Profit Manager</p>

    </header>



    <!-- ================================ -->
    <!-- MAIN -->
    <!-- ================================ -->

    <main>


        <!-- ================================ -->
        <!-- DASHBOARD -->
        <!-- ================================ -->

        <section class="dashboard">


            <div class="card">

                <h3>
                    Products
                </h3>

                <p id="totalProducts">
                    0
                </p>

            </div>



            <div class="card">

                <h3>
                    Total Stock
                </h3>

                <p id="totalStock">
                    0
                </p>

            </div>



            <div class="card">

                <h3>
                    Today's Sales
                </h3>

                <p id="todaySales">
                    ₹0
                </p>

            </div>



            <div class="card">

                <h3>
                    Today's Profit
                </h3>

                <p id="todayProfit">
                    ₹0
                </p>

            </div>



            <div class="card">

                <h3>
                    Monthly Profit
                </h3>

                <p id="monthProfit">
                    ₹0
                </p>

            </div>



            <div class="card">

                <h3>
                    Yearly Profit
                </h3>

                <p id="yearProfit">
                    ₹0
                </p>

            </div>


        </section>



        <!-- ================================ -->
        <!-- RESTART DAILY PROFIT -->
        <!-- ================================ -->

        <section class="box">

            <h2>
                Daily Profit
            </h2>

            <button
                onclick="restartDailyProfit()"
            >
                🔄 Restart Daily Profit
            </button>

            <p>
                Restarting will reset today's
                profit while keeping your
                sales history and monthly/yearly
                profit.
            </p>

        </section>



        <!-- ================================ -->
        <!-- ADD PRODUCT -->
        <!-- ================================ -->

        <section class="box">

            <h2>
                Add Product
            </h2>


            <input
                id="productName"
                type="text"
                placeholder="Product name"
            >


            <input
                id="buyPrice"
                type="number"
                placeholder="Buying price"
                min="0"
            >


            <input
                id="sellPrice"
                type="number"
                placeholder="Selling price"
                min="0"
            >


            <input
                id="stock"
                type="number"
                placeholder="Stock quantity"
                min="0"
            >


            <button
                onclick="addProduct()"
            >
                ➕ Add Product
            </button>


        </section>



        <!-- ================================ -->
        <!-- PRODUCTS -->
        <!-- ================================ -->

        <section class="box">

            <h2>
                Products
            </h2>


            <input
                id="searchBox"
                type="text"
                placeholder="🔍 Search product..."
                oninput="showProducts()"
            >


            <div id="productList"></div>


        </section>



        <!-- ================================ -->
        <!-- SALES HISTORY -->
        <!-- ================================ -->

        <section class="box">

            <h2>
                Sales History
            </h2>


            <div id="salesList"></div>


        </section>


    </main>



    <!-- ================================ -->
    <!-- JAVASCRIPT -->
    <!-- ================================ -->

    <script src="app.js"></script>



    <!-- ================================ -->
    <!-- SERVICE WORKER -->
    <!-- ================================ -->

    <script>

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register("./sw.js")

                .then(function() {

                    console.log(
                        "Service Worker registered"
                    );

                })

                .catch(function(error) {

                    console.log(
                        "Service Worker error:",
                        error
                    );

                });

        }

    </script>


</body>

</html>
